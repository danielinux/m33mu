name: test-firmware

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libtpms-dev vde2 libcapstone-dev libwolfssl-dev libvdeplug-dev vde-switch libdw-dev libelf-dev
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Configure
        run: cmake -S . -B build
      - name: Build m33mu
        run: cmake --build build
      - name: Fetch wolfSSL source tree for firmware build
        # The firmware Makefile (tests/firmware/test-stm32h563-wolfssl-iotsafe
        # and test-stm32u585-wolfssl-pka) compiles wolfSSL .c sources directly
        # with arm-none-eabi-gcc and expects a sibling checkout at
        # WOLFSSL_ROOT=../../../../wolfssl.
        # Track master rather than v5.9.1-stable to pick up post-5.9.1 SP-int
        # bug fixes (notably c119a2193 "SP int: fixes from review by Claude"
        # — fixes sp_mod_2d uninit-read and negation-loop OOB that triggered
        # the sp_256_rshift1_9 MemFault on CI). Re-pin to a tagged release
        # once one ships including these fixes.
        working-directory: ..
        run: git clone --depth 1 --branch master https://github.com/wolfSSL/wolfssl.git
      - name: Build firmware
        run: cmake --build build --target firmware-build
      - name: Run STM32H5 firmware test (SPI peripherals selection)
        run: build/m33mu tests/firmware/test-stm32h563/app.bin --spiflash:SPI1:file=/tmp/flash.bin:size=4096:mmap=0x60000000:cs=PB0 --tpm:SPI1:cs=PB1 --uart-stdout --expect-bkpt 0x7f --timeout 60 --quit-on-faults
      - name: Run STM32H5 dual-bank firmware test
        run: build/m33mu tests/firmware/test-stm32h563-dualbank/app.bin tests/firmware/test-stm32h563-dualbank/app.bin:0x100000 --dualbank --expect-bkpt 0x7f --timeout 60 --uart-stdout --quit-on-faults
      - name: Run STM32H5F4 dual-bank firmware test
        # Erases sector 250, which does not fit the H563's 7-bit SNB field,
        # so this covers both the widened field and the upper half of a
        # 2 MB bank. Against a model still masking SNB with 0x7f the erase
        # is truncated to sector 122 and the test fails.
        run: build/m33mu --cpu stm32h5f4 tests/firmware/test-stm32h5f4-dualbank/app.bin tests/firmware/test-stm32h5f4-dualbank/app.bin:0x200000 --dualbank --expect-bkpt 0x7f --timeout 60 --uart-stdout --quit-on-faults
      # NOTE: The STM32H5 wolfSSL IoTSAFE mTLS firmware test is
      # intentionally NOT run in CI. It performs a full TLS 1.2 handshake
      # under emulated Cortex-M33 with software P-256/AES-GCM and exhibits
      # a data-dependent crash (sp_256_mul_9 / sp_256_rshift1_9 -> wild
      # pointer -> MemFault at RAM_base - 4) 
      #   rm -f /tmp/m33mu-iotsafe-sim.bin
      #   build/m33mu --cpu stm32h563 --uart-stdout --expect-bkpt 0x42 \
      #     --timeout 60 --quit-on-faults \
      #     --iotsafe-uart:0x40004800:file=/tmp/m33mu-iotsafe-sim.bin \
      #     tests/firmware/test-stm32h563-wolfssl-iotsafe/app.bin
      # Re-enable once fixed.

      - name: Run STM32U5 firmware test (SPI peripherals selection)
        run: build/m33mu  tests/firmware/test-stm32u585/app.bin --spiflash:SPI1:file=/tmp/flash.bin:size=4096:mmap=0x60000000:cs=PB0 --tpm:SPI1:cs=PB1 --expect-bkpt 0x7f --timeout 60 --uart-stdout --cpu stm32u585 --quit-on-faults
      - name: Run STM32L5 firmware test (SPI peripherals selection)
        run: build/m33mu  tests/firmware/test-stm32l552/app.bin --spiflash:SPI1:file=/tmp/flash.bin:size=4096:mmap=0x60000000:cs=PB0 --tpm:SPI1:cs=PB1 --expect-bkpt 0x7f --timeout 60 --uart-stdout --cpu stm32l552 --quit-on-faults
      - name: Run nRF5340 firmware test (SPI flash read/write)
        run: build/m33mu  tests/firmware/test-nrf5340/app.bin --spiflash:SPI0:file=/tmp/flash.bin:size=4096:mmap=0x60000000:cs=PB0 --expect-bkpt 0x7f --timeout 60 --uart-stdout --cpu nrf5340 --quit-on-faults
      - name: Run nRF54LM20 firmware test
        run: build/m33mu  tests/firmware/test-nrf54lm20/app.bin --expect-bkpt 0x7f --timeout 60 --uart-stdout --cpu nrf54lm20 --quit-on-faults
      - name: Run STM32H5 firmware test (Floating point instructions)
        run: build/m33mu tests/firmware/test-fpu-instructions/app.bin --uart-stdout --expect-bkpt 0x7f --timeout 60 --quit-on-faults
      - name: Run RTOS exception firmware test
        run: build/m33mu tests/firmware/test-rtos-exceptions/app.bin --expect-bkpt 0x0 --timeout 60 --quit-on-faults
      - name: Run LPC55S69 HashCrypt firmware test
        run: |
          set -euo pipefail
          build/m33mu \
            --cpu lpc55s69 \
            --uart-stdout \
            --expect-bkpt 0x42 \
            --timeout 30 \
            --quit-on-faults \
            tests/firmware/test-lpc55s69-hashcrypt/app.bin | tee /tmp/m33mu-hashcrypt.log
          grep -q "HASHCRYPT TEST SUCCESSFUL" /tmp/m33mu-hashcrypt.log
      - name: Run STM32U585 OTFDEC firmware test
        run: |
          set -euo pipefail
          python3 tests/firmware/test-stm32u585-otfdec/gen_blob.py \
            tests/firmware/test-stm32u585-otfdec/spi_flash.bin
          build/m33mu \
            --cpu stm32u585 \
            --uart-stdout \
            --expect-bkpt 0x42 \
            --timeout 30 \
            --quit-on-faults \
            --spiflash:SPI1:file=tests/firmware/test-stm32u585-otfdec/spi_flash.bin:size=4096:mmap=0x60000000:cs=PB0 \
            tests/firmware/test-stm32u585-otfdec/app.bin | tee /tmp/m33mu-otfdec.log
          grep -q "OTFDEC TEST SUCCESSFUL" /tmp/m33mu-otfdec.log
      - name: Run LPC55S69 CASPER firmware test
        run: |
          set -euo pipefail
          build/m33mu \
            --cpu lpc55s69 \
            --uart-stdout \
            --expect-bkpt 0x42 \
            --timeout 30 \
            --quit-on-faults \
            tests/firmware/test-lpc55s69-casper/app.bin | tee /tmp/m33mu-casper.log
          grep -q "CASPER TEST SUCCESSFUL" /tmp/m33mu-casper.log
      - name: Run nRF5340 CryptoCell firmware test
        run: |
          set -euo pipefail
          build/m33mu \
            --cpu nrf5340 \
            --uart-stdout \
            --expect-bkpt 0x42 \
            --timeout 30 \
            --quit-on-faults \
            tests/firmware/test-nrf5340-cryptocell/app.bin | tee /tmp/m33mu-cc312.log
          grep -q "CRYPTOCELL TEST SUCCESSFUL" /tmp/m33mu-cc312.log
      - name: Run STM32U585 wolfSSL PKA ECDSA firmware test
        # Drives wolfSSL's WOLFSSL_STM32_PKA backend through ECDSA P-256
        # sign + verify; the host-side PKA peripheral uses only public
        # wolfSSL APIs (wc_ecc_mulmod, mp_*) so distro libwolfssl-dev is
        # sufficient — no custom wolfssl build required.
        run: |
          set -euo pipefail
          build/m33mu \
            --cpu stm32u585 \
            --uart-stdout \
            --expect-bkpt 0x42 \
            --timeout 60 \
            --quit-on-faults \
            tests/firmware/test-stm32u585-wolfssl-pka/app.bin | tee /tmp/m33mu-pka.log
          grep -q "PKA TEST SUCCESSFUL" /tmp/m33mu-pka.log
      - name: Run STM32H5F4 GPIO signal-injection firmware tests
        # A symbolic --signal-sync needs the ELF, so these load app.elf.
        run: |
          set -euo pipefail
          FW=tests/firmware
          COMMON=$FW/_signal_common
          run_signal_test() {
            local dir="$1" fixture="$2"; shift 2
            build/m33mu --cpu stm32h5f4 --dualbank --vdd-mv=3300 \
              --signal-file="$fixture" \
              --signal-sync="${SIGNAL_SYNC:-signal_trigger_marker}" \
              --expect-bkpt 0x7f --timeout 60 --quit-on-faults \
              "$@" \
              "$dir/app.elf"
          }
          run_signal_test $FW/test-stm32h5f4-signal-gpio-basic $COMMON/fixture_oneshot.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-exti-rising $COMMON/fixture_4cross.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-exti-falling $COMMON/fixture_4cross.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-exti-both $COMMON/fixture_4cross.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-exti-masked $COMMON/fixture_1cross.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-exti-wfi $COMMON/fixture_4cross.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-hysteresis $COMMON/fixture_hysteresis.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-sharp-edge $COMMON/fixture_sharp_edge.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-nonuniform $COMMON/fixture_nonuniform.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-mode-guard $COMMON/fixture_mode_guard.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-input-idle-high $COMMON/fixture_idle_high.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-trigger-oneshot $COMMON/fixture_oneshot.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          SIGNAL_SYNC=signal_midblock_marker \
            run_signal_test $FW/test-stm32h5f4-signal-trigger-midblock $COMMON/fixture_oneshot.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          run_signal_test $FW/test-stm32h5f4-signal-reset-keeps-running $COMMON/fixture_oneshot.sigc \
            --signal-bind:trace=vin:target=PA5:role=gpio
          # input-exti-masked passes without replay, so only the unreached trigger can fail it.
          if SIGNAL_SYNC=0x0c0ffff0 \
              run_signal_test $FW/test-stm32h5f4-signal-input-exti-masked $COMMON/fixture_1cross.sigc \
              --signal-bind:trace=vin:target=PA5:role=gpio; then
            echo "an unreached --signal-sync did not fail the run"
            exit 1
          fi
          # --signal-bind must be rejected on a target or pin that cannot be driven.
          if build/m33mu --cpu stm32u585 --signal-file=$COMMON/fixture_oneshot.sigc \
              --signal-bind:trace=vin:target=PA5:role=gpio --signal-sync=0x0c000000 \
              --timeout 10 tests/firmware/test-stm32u585/app.bin 2> /tmp/m33mu-signal-reject.log; then
            exit 1
          fi
          grep -q "has no GPIO signal injection" /tmp/m33mu-signal-reject.log
          if run_signal_test $FW/test-stm32h5f4-signal-gpio-basic $COMMON/fixture_oneshot.sigc \
              --signal-bind:trace=vin:target=PZ5:role=gpio 2> /tmp/m33mu-signal-reject.log; then
            exit 1
          fi
          grep -q "has no pin PZ5" /tmp/m33mu-signal-reject.log
          if run_signal_test $FW/test-stm32h5f4-signal-gpio-basic $COMMON/fixture_oneshot.sigc \
              --signal-bind:trace=vin:target=PA5:role=gpio:group=1 2> /tmp/m33mu-signal-reject.log; then
            exit 1
          fi
          grep -q "unrecognised --signal-bind field: group=1" /tmp/m33mu-signal-reject.log
          run_signal_test $FW/test-stm32h5f4-signal-multi-binding $COMMON/fixture_multi_binding.sigc \
            --signal-bind:trace=trace_a:target=PA5:role=gpio \
            --signal-bind:trace=trace_b:target=PB2:role=gpio
          # Digital Output tests need no --signal-file at all.
          build/m33mu --cpu stm32h5f4 --dualbank \
            --expect-bkpt 0x7f --timeout 60 --quit-on-faults \
            $FW/test-stm32h5f4-signal-output-loopback/app.bin
          build/m33mu --cpu stm32h5f4 --dualbank \
            --expect-bkpt 0x7f --timeout 60 --quit-on-faults \
            $FW/test-stm32h5f4-signal-output-timing/app.bin
          # PB0 toggles every 6400 cycles (100 us at 64 MHz) after the marker.
          build/m33mu --cpu stm32h5f4 --dualbank \
            --signal-sync=signal_trigger_marker \
            --signal-record=/tmp/m33mu-signal-record.csv \
            --signal-watch:target=PB0 --signal-watch:target=PB1 \
            --expect-bkpt 0x7f --timeout 60 --quit-on-faults \
            $FW/test-stm32h5f4-signal-record/app.elf
          python3 scripts/check_signal_record.py /tmp/m33mu-signal-record.csv \
            --levels PB0=Z,0,1,0,1,0,1,0,1,0 --levels PB1=Z,0,Z \
            --period PB0:8:100000:1000
      - name: Run M2354 firmware tests (Cortex-M23 baseline)
        # First ARMv8-M Baseline target: the console test also covers the
        # Thumb-1 "mov pc, rN" dispatch and the "add sp, rN" frame setup that
        # Thumb-2 builds never emit.
        run: |
          set -euo pipefail
          for t in test_uart test_fmc test_scu; do
            build/m33mu \
              --cpu m2354 \
              --uart-stdout \
              --expect-bkpt 0x7f \
              --timeout 60 \
              --quit-on-faults \
              tests/firmware/test-m2354/$t.bin | tee /tmp/m33mu-m2354-$t.log
            grep -q "ALL PASS" /tmp/m33mu-m2354-$t.log
          done
      - name: Run i.MX RT700 firmware tests (dual Cortex-M33, TrustZone)
        # Booted like the ROM does: FCB + XIP image, and a load-to-RAM image.
        # No --quit-on-faults: the AHBSC check provokes a non-secure fault on
        # purpose and recovers from it.
        run: |
          set -euo pipefail
          for t in app app-ramload; do
            build/m33mu \
              --cpu imxrt700 \
              --uart-stdout \
              --expect-bkpt 0x7f \
              --timeout 60 \
              tests/firmware/test-imxrt700/$t.bin < /dev/null | tee /tmp/m33mu-imxrt700-$t.log
            grep -q "ALL PASS" /tmp/m33mu-imxrt700-$t.log
          done
